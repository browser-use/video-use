[project]
name = "video-use"
version = "0.1.0"
description = "Conversation-driven video production framework for coding agents"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=7"]
animations = ["manim"]
editing = ["opencv-python-headless>=4.10,<5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = [".", "helpers"]
testpaths = ["tests"]
